name: organic_farm
description: Organic Farm mobile app for land, contracts, operations, production, finance, and media.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  video_player: ^2.9.2
  chewie: ^1.8.5
  webview_flutter: ^4.10.0
  open_filex: ^4.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Kadwa
      fonts:
        - asset: assets/fonts/Kadwa-Regular.ttf
        - asset: assets/fonts/Kadwa-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#016855"
  adaptive_icon_foreground: assets/images/app_icon.png
